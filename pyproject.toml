[project]
name = "murata-la"
version = "0.1.0"
description = "Import data into .xlsm templates without breaking controls, shapes, macros or formulas"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "lxml>=4.9",
]

[project.scripts]
xlsm-safe = "xlsm_safe.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["xlsm_safe"]

[project.optional-dependencies]
dev = [
    "pytest>=7",
]
